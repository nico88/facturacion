<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facturación - Sistema de Facturación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .product-item {
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            background: #f8f9fa;
        }
        .total-section {
            background: #e9ecef;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }
        .factura-item {
            border-bottom: 1px solid #dee2e6;
            padding: 10px 0;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-beer me-2"></i>
                Sistema de Facturación
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/"><i class="fas fa-home me-1"></i>Inicio</a>
                <a class="nav-link" href="/productos"><i class="fas fa-box me-1"></i>Productos</a>
                <a class="nav-link active" href="/facturacion"><i class="fas fa-receipt me-1"></i>Facturación</a>
                <a class="nav-link" href="/reportes"><i class="fas fa-chart-bar me-1"></i>Reportes</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <!-- Panel de Productos -->
            <div class="col-md-6">
                <h3><i class="fas fa-box me-2"></i>Productos Disponibles</h3>
                
                <!-- Filtros -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <select class="form-select" id="filtroCategoria">
                            <option value="">Todas las categorías</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <input type="text" class="form-control" id="buscarProducto" placeholder="Buscar producto...">
                    </div>
                </div>

                <!-- Lista de Productos -->
                <div id="productosList" style="max-height: 500px; overflow-y: auto;">
                    <!-- Los productos se cargarán aquí -->
                </div>
            </div>

            <!-- Panel de Factura -->
            <div class="col-md-6">
                <h3><i class="fas fa-receipt me-2"></i>Factura Actual</h3>
                
                <!-- Items de la Factura -->
                <div id="facturaItems">
                    <p class="text-muted">No hay productos en la factura</p>
                </div>

                <!-- Totales -->
                <div class="total-section">
                    <div class="row">
                        <div class="col-6">
                            <strong>Subtotal:</strong>
                        </div>
                        <div class="col-6 text-end">
                            <span id="subtotal">$0</span>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-6">
                            <strong>Impuestos (19%):</strong>
                        </div>
                        <div class="col-6 text-end">
                            <span id="impuestos">$0</span>
                        </div>
                    </div>
                    <hr>
                    <div class="row">
                        <div class="col-6">
                            <h5><strong>Total:</strong></h5>
                        </div>
                        <div class="col-6 text-end">
                            <h5><strong id="total">$0</strong></h5>
                        </div>
                    </div>
                </div>

                <!-- Botones -->
                <div class="mt-3">
                    <button class="btn btn-success btn-lg w-100" onclick="procesarFactura()" id="btnProcesar" disabled>
                        <i class="fas fa-check me-2"></i>Procesar Factura
                    </button>
                    <button class="btn btn-outline-danger mt-2 w-100" onclick="limpiarFactura()">
                        <i class="fas fa-trash me-2"></i>Limpiar Factura
                    </button>
                </div>
            </div>
        </div>

        <!-- Historial de Facturas -->
        <div class="row mt-5">
            <div class="col-12">
                <h3><i class="fas fa-history me-2"></i>Historial de Facturas</h3>
                <div id="historialFacturas">
                    <!-- El historial se cargará aquí -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let productos = [];
        let facturaItems = [];
        let facturas = [];

        document.addEventListener('DOMContentLoaded', function() {
            cargarCategorias();
            cargarProductos();
            cargarFacturas();
        });

        async function cargarCategorias() {
            try {
                const response = await fetch('/api/productos/categorias');
                const categorias = await response.json();
                
                const select = document.getElementById('filtroCategoria');
                select.innerHTML = '<option value="">Todas las categorías</option>';
                categorias.forEach(categoria => {
                    select.innerHTML += `<option value="${categoria}">${categoria}</option>`;
                });
            } catch (error) {
                console.error('Error cargando categorías:', error);
            }
        }

        async function cargarProductos() {
            try {
                const response = await fetch('/api/productos');
                productos = await response.json();
                mostrarProductos(productos);
            } catch (error) {
                console.error('Error cargando productos:', error);
            }
        }

        async function cargarFacturas() {
            try {
                const response = await fetch('/api/facturas');
                facturas = await response.json();
                mostrarFacturas(facturas);
            } catch (error) {
                console.error('Error cargando facturas:', error);
            }
        }

        function mostrarProductos(productosFiltrados) {
            const container = document.getElementById('productosList');
            container.innerHTML = '';

            productosFiltrados.forEach(producto => {
                if (producto.stock > 0) {
                    const card = `
                        <div class="product-item" data-producto-id="${producto.id}">
                            <div class="row align-items-center">
                                <div class="col-md-8">
                                    <h6 class="mb-1">${producto.nombre}</h6>
                                    <small class="text-muted">
                                        ${producto.categoria} | $${producto.precio.toLocaleString()} | Stock: ${producto.stock}
                                    </small>
                                </div>
                                <div class="col-md-4 text-end">
                                    <div class="input-group input-group-sm">
                                        <input type="number" class="form-control" id="cantidad-${producto.id}" 
                                               min="1" max="${producto.stock}" value="1" style="width: 60px;">
                                        <button class="btn btn-primary btn-sm" onclick="agregarAFactura(${producto.id})">
                                            <i class="fas fa-plus"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                }
            });
        }

        function agregarAFactura(productoId) {
            const producto = productos.find(p => p.id === productoId);
            const cantidad = parseInt(document.getElementById(`cantidad-${productoId}`).value);

            if (cantidad > producto.stock) {
                alert('No hay suficiente stock');
                return;
            }

            const itemExistente = facturaItems.find(item => item.producto.id === productoId);
            
            if (itemExistente) {
                itemExistente.cantidad += cantidad;
            } else {
                facturaItems.push({
                    producto: producto,
                    cantidad: cantidad,
                    precioUnitario: producto.precio
                });
            }

            actualizarFactura();
            document.getElementById(`cantidad-${productoId}`).value = 1;
        }

        function actualizarFactura() {
            const container = document.getElementById('facturaItems');
            
            if (facturaItems.length === 0) {
                container.innerHTML = '<p class="text-muted">No hay productos en la factura</p>';
                document.getElementById('btnProcesar').disabled = true;
            } else {
                let html = '';
                facturaItems.forEach((item, index) => {
                    const subtotal = item.cantidad * item.precioUnitario;
                    html += `
                        <div class="factura-item">
                            <div class="row align-items-center">
                                <div class="col-md-6">
                                    <strong>${item.producto.nombre}</strong><br>
                                    <small class="text-muted">$${item.precioUnitario.toLocaleString()} c/u</small>
                                </div>
                                <div class="col-md-3">
                                    <div class="input-group input-group-sm">
                                        <button class="btn btn-outline-secondary" onclick="cambiarCantidad(${index}, -1)">-</button>
                                        <input type="number" class="form-control text-center" value="${item.cantidad}" 
                                               min="1" max="${item.producto.stock}" style="width: 60px;">
                                        <button class="btn btn-outline-secondary" onclick="cambiarCantidad(${index}, 1)">+</button>
                                    </div>
                                </div>
                                <div class="col-md-2 text-end">
                                    <strong>$${subtotal.toLocaleString()}</strong>
                                </div>
                                <div class="col-md-1">
                                    <button class="btn btn-outline-danger btn-sm" onclick="eliminarItem(${index})">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
                document.getElementById('btnProcesar').disabled = false;
            }

            calcularTotales();
        }

        function cambiarCantidad(index, cambio) {
            const item = facturaItems[index];
            const nuevaCantidad = item.cantidad + cambio;
            
            if (nuevaCantidad >= 1 && nuevaCantidad <= item.producto.stock) {
                item.cantidad = nuevaCantidad;
                actualizarFactura();
            }
        }

        function eliminarItem(index) {
            facturaItems.splice(index, 1);
            actualizarFactura();
        }

        function calcularTotales() {
            const subtotal = facturaItems.reduce((sum, item) => sum + (item.cantidad * item.precioUnitario), 0);
            const impuestos = subtotal * 0.19;
            const total = subtotal + impuestos;

            document.getElementById('subtotal').textContent = `$${subtotal.toLocaleString()}`;
            document.getElementById('impuestos').textContent = `$${impuestos.toLocaleString()}`;
            document.getElementById('total').textContent = `$${total.toLocaleString()}`;
        }

        async function procesarFactura() {
            if (facturaItems.length === 0) {
                alert('No hay productos en la factura');
                return;
            }

            try {
                const response = await fetch('/api/facturas', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(facturaItems)
                });

                if (response.ok) {
                    const factura = await response.json();
                    alert(`Factura procesada correctamente!\nNúmero: ${factura.numeroFactura}\nTotal: $${factura.total.toLocaleString()}`);
                    
                    facturaItems = [];
                    actualizarFactura();
                    cargarProductos();
                    cargarFacturas();
                } else {
                    alert('Error al procesar la factura');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error al procesar la factura');
            }
        }

        function limpiarFactura() {
            if (confirm('¿Está seguro de limpiar la factura?')) {
                facturaItems = [];
                actualizarFactura();
            }
        }

        function mostrarFacturas(facturas) {
            const container = document.getElementById('historialFacturas');
            container.innerHTML = '';

            if (facturas.length === 0) {
                container.innerHTML = '<p class="text-muted">No hay facturas registradas</p>';
                return;
            }

            facturas.forEach(factura => {
                const fecha = new Date(factura.fecha).toLocaleString();
                const card = `
                    <div class="card mb-3">
                        <div class="card-body">
                            <div class="row align-items-center">
                                <div class="col-md-3">
                                    <strong>#${factura.numeroFactura}</strong><br>
                                    <small class="text-muted">${fecha}</small>
                                </div>
                                <div class="col-md-3">
                                    <span class="badge bg-primary">${factura.items.length} productos</span>
                                </div>
                                <div class="col-md-3">
                                    <strong>$${factura.total.toLocaleString()}</strong>
                                </div>
                                <div class="col-md-3 text-end">
                                    <button class="btn btn-outline-info btn-sm" onclick="verDetalleFactura(${factura.id})">
                                        <i class="fas fa-eye"></i> Ver Detalle
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        function verDetalleFactura(facturaId) {
            const factura = facturas.find(f => f.id === facturaId);
            if (factura) {
                let detalle = `Factura #${factura.numeroFactura}\n`;
                detalle += `Fecha: ${new Date(factura.fecha).toLocaleString()}\n\n`;
                detalle += `Productos:\n`;
                factura.items.forEach(item => {
                    detalle += `- ${item.producto.nombre} x${item.cantidad} = $${item.subtotal.toLocaleString()}\n`;
                });
                detalle += `\nSubtotal: $${factura.subtotal.toLocaleString()}\n`;
                detalle += `Impuestos: $${factura.impuestos.toLocaleString()}\n`;
                detalle += `Total: $${factura.total.toLocaleString()}`;
                
                alert(detalle);
            }
        }

        // Filtros
        document.getElementById('filtroCategoria').addEventListener('change', function() {
            const categoria = this.value;
            const busqueda = document.getElementById('buscarProducto').value;
            filtrarProductos(categoria, busqueda);
        });

        document.getElementById('buscarProducto').addEventListener('input', function() {
            const categoria = document.getElementById('filtroCategoria').value;
            const busqueda = this.value;
            filtrarProductos(categoria, busqueda);
        });

        function filtrarProductos(categoria, busqueda) {
            let productosFiltrados = productos;

            if (categoria) {
                productosFiltrados = productosFiltrados.filter(p => p.categoria === categoria);
            }

            if (busqueda) {
                productosFiltrados = productosFiltrados.filter(p => 
                    p.nombre.toLowerCase().includes(busqueda.toLowerCase()) ||
                    p.marca?.toLowerCase().includes(busqueda.toLowerCase())
                );
            }

            mostrarProductos(productosFiltrados);
        }
    </script>
</body>
</html>
